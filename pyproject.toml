[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerk-vpn"
version = "0.1.0"
description = "Автоматическая установка и настройка каскадных VPN на Xray (VLESS + Reality)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
lerk-vpn = "lerk_vpn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lerk_vpn.web" = ["static/*"]
